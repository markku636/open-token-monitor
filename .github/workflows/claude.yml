name: Claude

# Mention @claude in an issue or pull request comment to have Claude Code work
# on it, for example to finish an upstream update the upstream-watch workflow
# opened. Only people with write access can trigger it.
#
# Needs one repository secret: CLAUDE_CODE_OAUTH_TOKEN (from `claude
# setup-token`, or /install-github-app in Claude Code) or ANTHROPIC_API_KEY.
# Without either, this workflow fails and nothing else is affected.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  claude:
    if: >-
      (github.event_name == 'issues' && contains(github.event.issue.body, '@claude')) ||
      (github.event_name != 'issues' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TOKEN_MONITOR_DISABLE_KEYRING: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@1.88
        with:
          components: clippy, rustfmt
      # keyring's Secret Service backend (Linux) links libdbus through pkg-config.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config
      - run: npm ci
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: >-
            --allowedTools "Bash(npm:*),Bash(node:*),Bash(git:*),Bash(cargo:*),Edit,Write,Read,Glob,Grep"
